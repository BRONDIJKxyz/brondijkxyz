<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generate social card — brondijk.xyz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:32px; background:#16130D; color:#F4ECDC;
         font-family:'JetBrains Mono',monospace; display:flex; flex-direction:column; align-items:center; gap:20px; }
  canvas { width:600px; height:315px; border:1px solid #4a4334; border-radius:8px; }
  button { font:600 15px 'JetBrains Mono',monospace; padding:12px 22px; cursor:pointer;
           background:#FF6B70; color:#16130D; border:none; border-radius:8px; }
  button:hover { filter:brightness(1.08); }
  .hint { max-width:600px; font-size:13px; line-height:1.7; color:#b3a98f; text-align:center; }
  code { background:#211C13; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
  <h2 style="font-weight:500;margin:0">social card generator</h2>
  <canvas id="c" width="1200" height="630"></canvas>
  <button id="dl">Download social-card.png</button>
  <p class="hint">Click download, then save the file as <code>social-card.png</code> into the
     <code>assets/</code> folder (next to <code>social-card.svg</code>) and commit it.
     The OG tags across the site already point at that path.</p>

<script>
const paper='#FAF3E7', ink='#141414', white='#FFFFFF', accent='#E5484D', muted='#6F6A60';
const cv=document.getElementById('c'), x=cv.getContext('2d');

function rr(c,X,Y,W,H,r){c.beginPath();c.moveTo(X+r,Y);c.arcTo(X+W,Y,X+W,Y+H,r);
  c.arcTo(X+W,Y+H,X,Y+H,r);c.arcTo(X,Y+H,X,Y,r);c.arcTo(X,Y,X+W,Y,r);c.closePath();}

function chip(label,X,W){
  x.lineWidth=2; x.strokeStyle=ink; rr(x,X,470,W,40,20); x.stroke();
  x.fillStyle=ink; x.font="500 20px 'JetBrains Mono',monospace"; x.textAlign='center';
  x.fillText(label, X+W/2, 497);
}

function draw(){
  x.fillStyle=paper; x.fillRect(0,0,1200,630);
  // accent hatch, top-right
  x.save(); x.beginPath(); x.rect(760,0,440,300); x.clip();
  x.strokeStyle='rgba(229,72,77,0.14)'; x.lineWidth=13;
  for(let i=-300;i<1300;i+=26){x.beginPath();x.moveTo(i,-20);x.lineTo(i+320,300);x.stroke();}
  x.restore();
  // shadow + card
  x.fillStyle=ink; rr(x,84,84,1032,462,22); x.fill();
  x.fillStyle=white; rr(x,70,70,1032,462,22); x.fill();
  x.lineWidth=3; x.strokeStyle=ink; rr(x,70,70,1032,462,22); x.stroke();
  // brand row
  x.textAlign='left';
  x.fillStyle=ink; x.font="800 34px Inter,sans-serif"; x.fillText('brondijk.xyz',118,162);
  x.fillStyle=muted; x.font="400 21px 'JetBrains Mono',monospace";
  x.fillText('· builds useful tools, fast',355,162);
  // headline
  x.fillStyle=ink; x.font="800 88px Inter,sans-serif";
  x.fillText('I build useful',114,322);
  const t='tools. '; x.fillText(t,114,418);
  x.fillStyle=accent; x.fillText('Fast.',114+x.measureText(t).width,418);
  // accent diamond
  x.fillStyle='rgba(229,72,77,0.85)'; x.font="60px Inter,sans-serif"; x.textAlign='center';
  x.fillText('◆',1012,378);
  // chips + name
  chip('ships fast',116,176); chip('runs in production',304,248); chip('built with AI',564,196);
  x.fillStyle=muted; x.font="500 20px 'JetBrains Mono',monospace"; x.textAlign='right';
  x.fillText('maarten brondijk',1054,497);
}

document.getElementById('dl').onclick=()=>{
  const a=document.createElement('a');
  a.download='social-card.png'; a.href=cv.toDataURL('image/png'); a.click();
};

if(document.fonts && document.fonts.ready){ document.fonts.ready.then(draw); setTimeout(draw,600); }
else { window.onload=draw; }
</script>
</body>
</html>
