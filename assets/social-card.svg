<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="26" height="26" fill="none"/>
      <rect width="13" height="26" fill="#E5484D" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <!-- warm paper background -->
  <rect width="1200" height="630" fill="#FAF3E7"/>
  <!-- subtle accent hatch, top-right corner -->
  <rect x="760" y="0" width="440" height="300" fill="url(#hatch)"/>

  <!-- hard offset shadow + framed card -->
  <rect x="84" y="84" width="1032" height="462" rx="22" fill="#141414"/>
  <rect x="70" y="70" width="1032" height="462" rx="22" fill="#FFFFFF" stroke="#141414" stroke-width="3"/>

  <!-- brand row -->
  <text x="118" y="162" font-size="34" font-weight="800" letter-spacing="-1" fill="#141414">brondijk.xyz</text>
  <text x="355" y="162" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" fill="#6F6A60">· builds useful tools, fast</text>

  <!-- headline -->
  <text x="116" y="322" font-size="88" font-weight="800" letter-spacing="-4" fill="#141414">I build useful</text>
  <text x="116" y="418" font-size="88" font-weight="800" letter-spacing="-4" fill="#141414">tools. <tspan fill="#E5484D">Fast.</tspan></text>

  <!-- accent diamond -->
  <text x="1012" y="360" font-size="60" fill="#E5484D" fill-opacity="0.85" text-anchor="middle">◆</text>

  <!-- footer chips -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="500">
    <rect x="116" y="470" width="176" height="40" rx="20" fill="none" stroke="#141414" stroke-width="2"/>
    <text x="204" y="497" fill="#141414" text-anchor="middle">ships fast</text>

    <rect x="304" y="470" width="248" height="40" rx="20" fill="none" stroke="#141414" stroke-width="2"/>
    <text x="428" y="497" fill="#141414" text-anchor="middle">runs in production</text>

    <rect x="564" y="470" width="196" height="40" rx="20" fill="none" stroke="#141414" stroke-width="2"/>
    <text x="662" y="497" fill="#141414" text-anchor="middle">built with AI</text>

    <text x="1054" y="497" fill="#6F6A60" text-anchor="end">maarten brondijk</text>
  </g>
</svg>
