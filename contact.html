<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - brondijk.xyz</title>
    <meta name="description" content="Contact page for Maarten Brondijk">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-56LC4J0MT0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-56LC4J0MT0');
    </script>

    <!-- avoid dark-mode flash -->
    <script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('pre-dark');}catch(e){}</script>
    <style>html.pre-dark body{background:#16130D;color:#F4ECDC;}</style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/site.css">

    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="assets/favicon/site.webmanifest">
    <link rel="shortcut icon" href="assets/favicon/favicon.ico">
</head>
<body>
    <header class="site">
        <div class="wrap">
            <a href="index.html" class="logo">brondijk.xyz</a>
            <nav>
                <a href="blog.html">blog</a>
                <a href="index.html#projects">projects</a>
                <a href="contact.html">contact</a>
                <a href="https://github.com/brondijkxyz" target="_blank" rel="noopener noreferrer">github</a>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1 class="page-title">Contact</h1>
        <div class="contact-section">
            <div class="contact-info">
                <p>Have a question, comment, or want to discuss a project? Use the form below to get in touch.</p>
            </div>

            <form id="contactForm" action="https://formspree.io/f/mdkeznaj" method="POST">
                <div class="form-group">
                    <input type="text" id="name" name="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <input type="text" id="subject" name="subject" placeholder="Subject">
                </div>
                <div class="form-group">
                    <textarea id="message" name="message" placeholder="Your Message" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
    </main>

    <footer class="site">
        <div class="wrap">
            <span>© <span id="current-year"></span> brondijk.xyz</span>
            <span>built with too much AI and a little coffee</span>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        // Form submission handling with feedback
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.textContent = 'Sending...';
            submitBtn.disabled = true;
        });
    </script>
</body>
</html>
