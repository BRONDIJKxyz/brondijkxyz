<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - brondijk.xyz</title>
    <meta name="description" content="Contact page for Maarten Brondijk">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-56LC4J0MT0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-56LC4J0MT0');
    </script>
    
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="assets/favicon/site.webmanifest">
    <link rel="shortcut icon" href="assets/favicon/favicon.ico">
    
    <style>
        .contact-section {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background-color: #252525;
            border: 1px solid #333;
            color: var(--text-color);
            font-family: 'JetBrains Mono', monospace;
            border-radius: 4px;
            font-size: 0.9rem;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(0, 179, 179, 0.2);
        }
        
        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: #121212;
            border: none;
            padding: 12px 24px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        .btn-primary:hover {
            background-color: var(--hover-color);
        }
        
        #contactForm {
            animation: fadeIn 0.5s ease-out forwards;
        }
        
        .contact-info {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="index.html" style="text-decoration: none; color: inherit;">brondijk.xyz</a></h1>
            <nav>
                <ul>
                    <li><a href="index.html#home">Home</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="index.html#projects">Projects</a></li>
                    <li><a href="index.html#resources">Resources</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                    <li><a href="https://github.com/brondijkxyz" target="_blank" rel="noopener noreferrer">GitHub</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="contact" class="container">
            <h2 class="page-title">Contact</h2>
            <div class="contact-section">
                <div class="contact-info">
                    <p>Have a question, comment, or want to discuss a project? Use the form below to get in touch.</p>
                </div>
                
                <form id="contactForm" action="https://formspree.io/f/mdkeznaj" method="POST">
                    <div class="form-group">
                        <input type="text" id="name" name="name" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" name="email" placeholder="Your Email" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="subject" name="subject" placeholder="Subject">
                    </div>
                    <div class="form-group">
                        <textarea id="message" name="message" placeholder="Your Message" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="current-year"></span> brondijk.xyz</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        // Form submission handling with feedback
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.textContent = 'Sending...';
            submitBtn.disabled = true;
        });
    </script>
</body>
</html>
